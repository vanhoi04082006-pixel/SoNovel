<?xml version="1.0" encoding="utf-8"?>
<!-- SoNovel — v2 safe-zone: toàn bộ emblem nằm trong vòng tròn an toàn adaptive icon (~66%),
     nền tràn full-bleed. Play gradient tím→hồng + sóng âm + sách mở, nền chàm đậm -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sn-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241645"/>
      <stop offset="0.6" stop-color="#170f2c"/>
      <stop offset="1" stop-color="#0d0819"/>
    </linearGradient>
    <radialGradient id="sn-glow" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#7c3aed" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sn-play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="sn-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d3ff"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#sn-bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#sn-glow)"/>

  <!-- quai tai nghe -->
  <path d="M120 272 V236 C120 160 180 108 256 108 C332 108 392 160 392 236 V272"
        fill="none" stroke="url(#sn-gold)" stroke-width="26" stroke-linecap="round"/>
  <!-- củ tai -->
  <rect x="118" y="262" width="52" height="84" rx="26" fill="url(#sn-gold)"/>
  <rect x="342" y="262" width="52" height="84" rx="26" fill="url(#sn-gold)"/>
  <rect x="130" y="278" width="22" height="52" rx="11" fill="#2a1a4e" opacity="0.6"/>
  <rect x="360" y="278" width="22" height="52" rx="11" fill="#2a1a4e" opacity="0.6"/>

  <!-- sóng âm 2 bên -->
  <line x1="106" y1="246" x2="106" y2="278" stroke="#c4b5fd" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <line x1="132" y1="226" x2="132" y2="298" stroke="#c4b5fd" stroke-width="12" stroke-linecap="round" opacity="0.95"/>
  <line x1="406" y1="246" x2="406" y2="278" stroke="#f0abfc" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <line x1="380" y1="226" x2="380" y2="298" stroke="#f0abfc" stroke-width="12" stroke-linecap="round" opacity="0.95"/>

  <!-- nút play gradient -->
  <circle cx="256" cy="260" r="76" fill="url(#sn-play)"/>
  <circle cx="256" cy="260" r="76" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>
  <path d="M236 220 L294 260 L236 300 Z" fill="#ffffff" stroke-linejoin="round"/>

  <!-- sách mở dưới chân -->
  <path d="M198 388 Q227 376 256 388 Q285 376 314 388 L314 412 Q285 400 256 412 Q227 400 198 412 Z"
        fill="none" stroke="#c4b5fd" stroke-width="12" stroke-linejoin="round"/>
  <line x1="256" y1="388" x2="256" y2="412" stroke="#c4b5fd" stroke-width="9" opacity="0.8"/>

  <!-- tia lấp lánh -->
  <path d="M378 148 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5 Z" fill="#f0abfc" opacity="0.95"/>
  <path d="M124 158 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z" fill="#c4b5fd" opacity="0.7"/>
</svg>
