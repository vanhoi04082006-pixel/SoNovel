<?xml version="1.0" encoding="utf-8"?>
<!-- SoNovel — concept mới: nút play gradient tím→hồng + sóng âm + sách mở, nền chàm đậm -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sn-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241645"/>
      <stop offset="0.6" stop-color="#170f2c"/>
      <stop offset="1" stop-color="#0d0819"/>
    </linearGradient>
    <radialGradient id="sn-glow" cx="0.5" cy="0.44" r="0.58">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#7c3aed" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sn-play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="sn-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#sn-bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#sn-glow)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="url(#sn-ring)" stroke-opacity="0.4" stroke-width="5"/>

  <!-- sóng âm trái (cao dần vào giữa) -->
  <line x1="92" y1="238" x2="92" y2="286" stroke="#c4b5fd" stroke-width="15" stroke-linecap="round" opacity="0.75"/>
  <line x1="126" y1="216" x2="126" y2="308" stroke="#c4b5fd" stroke-width="15" stroke-linecap="round" opacity="0.9"/>
  <line x1="160" y1="238" x2="160" y2="286" stroke="#c4b5fd" stroke-width="15" stroke-linecap="round" opacity="0.75"/>
  <!-- sóng âm phải -->
  <line x1="352" y1="238" x2="352" y2="286" stroke="#f0abfc" stroke-width="15" stroke-linecap="round" opacity="0.75"/>
  <line x1="386" y1="216" x2="386" y2="308" stroke="#f0abfc" stroke-width="15" stroke-linecap="round" opacity="0.9"/>
  <line x1="420" y1="238" x2="420" y2="286" stroke="#f0abfc" stroke-width="15" stroke-linecap="round" opacity="0.75"/>

  <!-- nút play gradient -->
  <circle cx="256" cy="262" r="86" fill="url(#sn-play)"/>
  <circle cx="256" cy="262" r="86" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>
  <path d="M232 214 L306 262 L232 310 Z" fill="#ffffff" stroke-linejoin="round"/>

  <!-- sách mở dưới chân -->
  <path d="M176 392 Q216 378 256 392 Q296 378 336 392 L336 428 Q296 414 256 428 Q216 414 176 428 Z"
        fill="none" stroke="#c4b5fd" stroke-width="13" stroke-linejoin="round"/>
  <line x1="256" y1="392" x2="256" y2="428" stroke="#c4b5fd" stroke-width="10" opacity="0.8"/>

  <!-- tia lấp lánh -->
  <path d="M408 108 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5 Z" fill="#f0abfc" opacity="0.95"/>
  <path d="M98 128 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z" fill="#c4b5fd" opacity="0.7"/>
</svg>
