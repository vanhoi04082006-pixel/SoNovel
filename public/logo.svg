<?xml version="1.0" encoding="utf-8"?>
<!-- SoNovel — logo cao cấp: nền chàm đậm + quầng hổ phách, tai nghe vàng ôm chữ S trắng, sách mở dưới chân -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sn-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1a52"/>
      <stop offset="0.62" stop-color="#1a1032"/>
      <stop offset="1" stop-color="#0e0819"/>
    </linearGradient>
    <radialGradient id="sn-glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#f59e0b" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sn-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe1a1"/>
      <stop offset="0.5" stop-color="#f7bd55"/>
      <stop offset="1" stop-color="#d98a12"/>
    </linearGradient>
    <linearGradient id="sn-pad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c97e0e"/>
      <stop offset="0.5" stop-color="#ffe1a1"/>
      <stop offset="1" stop-color="#c97e0e"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#sn-bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#sn-glow)"/>
  <!-- viền vàng mảnh -->
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#f7bd55" stroke-opacity="0.35" stroke-width="5"/>

  <!-- quai tai nghe -->
  <path d="M104 296 V252 C104 156 172 92 256 92 C340 92 408 156 408 252 V296"
        fill="none" stroke="url(#sn-gold)" stroke-width="30" stroke-linecap="round"/>
  <!-- củ tai -->
  <rect x="72" y="282" width="66" height="112" rx="33" fill="url(#sn-pad)"/>
  <rect x="374" y="282" width="66" height="112" rx="33" fill="url(#sn-pad)"/>
  <rect x="86" y="302" width="26" height="72" rx="13" fill="#3a2a12" opacity="0.55"/>
  <rect x="400" y="302" width="26" height="72" rx="13" fill="#3a2a12" opacity="0.55"/>

  <!-- chữ S trắng nổi -->
  <path d="M348 208 C330 184 302 172 264 172 C216 172 188 198 188 232 C188 296 324 272 324 336 C324 370 294 396 246 396 C210 396 182 384 162 360"
        fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round"/>
  <!-- sóng âm 2 bên S -->
  <line x1="150" y1="252" x2="150" y2="308" stroke="#f7bd55" stroke-width="13" stroke-linecap="round" opacity="0.9"/>
  <line x1="362" y1="252" x2="362" y2="308" stroke="#f7bd55" stroke-width="13" stroke-linecap="round" opacity="0.9"/>

  <!-- sách mở dưới chân -->
  <path d="M176 428 Q216 414 256 428 Q296 414 336 428 L336 462 Q296 448 256 462 Q216 448 176 462 Z"
        fill="none" stroke="#f7bd55" stroke-width="13" stroke-linejoin="round"/>
  <line x1="256" y1="428" x2="256" y2="462" stroke="#f7bd55" stroke-width="10" opacity="0.8"/>

  <!-- tia lấp lánh -->
  <path d="M414 132 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5 Z" fill="#ffe1a1" opacity="0.95"/>
  <path d="M92 150 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z" fill="#ffe1a1" opacity="0.7"/>
</svg>
