name = "sonovel-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "sonovel"
database_id = "00fd3513-159a-4bbd-b4a7-884980cc54e6"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "COVERS"
bucket_name = "sonovel-covers"

# Rate limiting via in-memory map in workers/src/rate-limit.ts (Phase 2)
